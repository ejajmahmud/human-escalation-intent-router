[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "human-escalation-intent-router"
version = "0.1.0"
description = "Semantic intent router assessing decision ambiguity, uncertainty thresholds, and financial impact to escalate to human operators"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
human-escalation-intent-router = "human_escalation_intent_router.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["human_escalation_intent_router*"]
